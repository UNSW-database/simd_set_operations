type         = "pair"                                                      # Data bin type
datatype     = "U32"                                                       # Data type
max_set_size = 0x10_0000                                                   # Choice of reference set and fixed size
skew         = { from = 0.0001, to = 1.0, step  = 10.0, mode = "log"    }  # Ratio of the size of the smaller set to the size of the larger set
selectivity  = { from = 0.0,    to = 1.0, steps = 11,   mode = "linear" }  # Ratio of the size of the intersection to the size of the smaller set
density      = { from = 0.0001, to = 0.1, step  = 10.0, mode = "log"    }  # Ratio of the largest possible data value to the size of the larger set
distribution = { type = "uniform" }                                        # Distribution that data values will be sampled from
trials       = 9                                                           # Trials per configuration
